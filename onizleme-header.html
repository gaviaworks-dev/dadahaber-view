<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header varyant önizleme — A / B</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f4f4f5;
      color: #18181b;
    }

    header.bar {
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid #e4e4e7;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header.bar h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    header.bar p {
      margin: 0;
      color: #52525b;
    }

    .widths button {
      font: inherit;
      padding: 5px 12px;
      margin-left: 6px;
      border: 1px solid #d4d4d8;
      background: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    .widths button[aria-pressed="true"] {
      background: #18181b;
      color: #fff;
      border-color: #18181b;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
      align-items: start;
    }

    @media (max-width: 1100px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .pane {
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 10px;
      overflow: hidden;
      min-width: 0;
    }

    .pane h2 {
      margin: 0;
      padding: 10px 14px;
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
      border-bottom: 1px solid #e4e4e7;
      background: #fafafa;
    }

    .pane h2 small {
      display: block;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
      color: #71717a;
      margin-top: 2px;
    }

    .frame-wrap {
      overflow: auto;
    }

    iframe {
      display: block;
      border: 0;
      height: 620px;
      background: #fff;
    }
  </style>
</head>

<body>
  <header class="bar">
    <h1>Header varyant önizleme</h1>
    <p>Aynı sayfa, iki varyant yan yana. Alttaki genişlik düğmeleri iframe genişliğini değiştirir.</p>
    <div class="widths">
      <button type="button" data-w="1440" aria-pressed="true">1440</button>
      <button type="button" data-w="1000" aria-pressed="false">1000</button>
      <button type="button" data-w="768" aria-pressed="false">768</button>
      <button type="button" data-w="390" aria-pressed="false">390</button>
    </div>
  </header>

  <div class="grid">
    <section class="pane">
      <h2>Varyant A
        <small>Ana bar kurumsal renk zeminli, metin koyu tonda (kontrast 10,58:1)</small>
      </h2>
      <div class="frame-wrap"><iframe id="fa" src="index.html?v=a" title="Varyant A"></iframe></div>
    </section>

    <section class="pane">
      <h2>Varyant B
        <small>Ana bar beyaz zeminli, sadece etiket ve vurgular kurumsal renkte</small>
      </h2>
      <div class="frame-wrap"><iframe id="fb" src="index.html?v=b" title="Varyant B"></iframe></div>
    </section>
  </div>

  <script>
    var btns = document.querySelectorAll('.widths button');
    var frames = [document.getElementById('fa'), document.getElementById('fb')];

    function setWidth(w) {
      frames.forEach(function (f) { f.style.width = w + 'px'; });
      btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.w === w)); });
    }

    btns.forEach(function (b) {
      b.addEventListener('click', function () { setWidth(b.dataset.w); });
    });

    setWidth('1440');
  </script>
</body>

</html>
